[package]
name = "streamduck-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7.1"
tokio-tungstenite = "0.27"
hidapi = { version = "2.6.3", features = ["windows-native"] }
image = { version = "0.25", features = ["serde"] }
itertools = "0.14"
log = "0.4"
mlua = { version = "0.11", features = ["luajit52", "macros", "serde", "vendored"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.14"
thiserror = "2.0"
tokio = { version = "1.47", features = ["net", "rt", "sync"] }
futures = "0.3"
rand = "0.9"
directories = "6"